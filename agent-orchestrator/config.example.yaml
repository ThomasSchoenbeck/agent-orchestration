# ═══════════════════════════════════════════════════════════════════════════════
# Agent Orchestrator — Example Configuration (every available option)
#
# Copy to config.yaml and adjust. ${ENV_VAR} references are expanded from the
# process environment at startup, so secrets never need to live in this file.
# Provider / role / template sections are SEEDED INTO THE DATABASE on first run
# only — after that, manage them via the UI / API.
#
# Run:  ./agent-orchestrator server --config config.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8080                 # TCP port the HTTP server binds to. Default: 8080
  host: "0.0.0.0"            # interface to listen on ("0.0.0.0" = all). Default: 0.0.0.0
  external_host: ""          # publicly-reachable address agents use (defaults to host)
  tls_enabled: false         # legacy/unused — superseded by `insecure` below
  insecure: false            # serve plain HTTP instead of HTTPS. Default: false (HTTPS).
                             #   Also settable via `server --insecure`. Use for local/dev.
  tls_cert_file: ""          # PEM cert path; with tls_key_file, used for HTTPS.
  tls_key_file: ""           # PEM key path (pairs with tls_cert_file).
                             #   When both empty, the server auto-generates a self-signed cert
                             #   under {storage.root}/tls and reuses it on restart.

# ─────────────────────────────────────────────────────────────────────────────
# Database (main) + separate logs DB
# ─────────────────────────────────────────────────────────────────────────────
database:
  type: sqlite               # only "sqlite" is supported
  path: ./data/orchestrator.db

logs_db:
  type: sqlite               # high-volume agent/task logs live in a separate file
  path: ./data/logs.db       # empty → defaults to ./data/logs.db next to the main DB

# ─────────────────────────────────────────────────────────────────────────────
# LLM Providers
#
# type: openai_compatible | anthropic | azure | ollama
# Each provider declares its models under `models:` — that is what binds a model
# to the roles it serves and sets pricing. Flag one model `default: true` to make
# it the provider's default (else the first model is used).
# ─────────────────────────────────────────────────────────────────────────────
providers:
  # ── OpenAI-compatible (OpenAI, local llama.cpp, LM Studio, vLLM, …) ──────────
  - name: openai
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    # request_timeout_sec: 300            # HTTP timeout per LLM call. 0/omitted →
    #                                     # 300s for local (ollama/openai_compatible),
    #                                     # 120s for cloud. Raise for slow local models.
    roles: [orchestrator, worker]         # roles this provider can serve (coarse fallback)
    # system_prompt: ""                   # optional provider-level prompt layer
    models:
      - name: gpt-4o
        default: true                     # provider's default model
        input_per_million: 2.50           # USD per 1M input tokens
        output_per_million: 10.00         # USD per 1M output tokens
        context_window: 128000            # max context tokens (shown as "used / max" per message)
        text_tool_calls: false            # emit tool calls as text (for small models)
        fold_system_into_user: false      # merge system prompt into the user turn
        system_prefix: ""                 # optional prefix prepended to the system prompt
        # system_prompt: ""               # optional model-level prompt layer (blended by prompt_prep)
        tool_allowlist: []                # model-level tool allowlist (empty = inherit)

  # ── Anthropic (Claude) ───────────────────────────────────────────────────────
  - name: anthropic
    type: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    roles: [reviewer]
    models:
      - name: claude-sonnet-4-6
        default: true
        input_per_million: 3.00
        output_per_million: 15.00

  # ── Azure OpenAI (deployment-based URLs) ─────────────────────────────────────
  - name: azure-gpt4o
    type: azure
    base_url: "https://my-resource.openai.azure.com"   # no trailing slash
    api_key: "${AZURE_OPENAI_API_KEY}"
    deployment: "gpt4o-prod"              # Azure deployment name
    roles: [worker]
    models:
      - name: gpt-4o
        default: true

  # ── Ollama (local, no auth) ──────────────────────────────────────────────────
  - name: ollama-local
    type: ollama
    base_url: "http://localhost:11434"
    roles: [worker]
    models:
      - name: llama3.2
        default: true
        # local models are free — omit pricing or set to 0

# ─────────────────────────────────────────────────────────────────────────────
# Role Definitions — seeded into the DB with full persona.
# `capabilities` are the flags the router/authorization act on:
#   handles_review  — may claim AWAITING_REVIEW tasks
#   handles_merge   — may claim AWAITING_MERGE tasks
#   creates_tasks   — may create work packages / plan
# `allowed_tools` empty → all tools permitted.
#
# Routing (Phase 5): a role may declare an ordered `models:` provider>model priority
# list. The router resolves the first available entry and fails over to the next on
# error/unavailability (circuit-open, unregistered provider). When `models:` is set it
# takes precedence; `provider`/`model_override` remain the single-binding fallback used
# only when every list entry is unavailable. A role must resolve to SOME route (a
# `models:` list, a `provider:`, or a provider that lists the role under its `roles:`) or
# config validation rejects it.
#
# Layered prompts (Phase 5): `system_prompt` here is the ROLE layer. The prompt_prep
# subagent blends all present layers — agent, role, subagent, provider, model — plus the
# task description into the final system prompt for each LLM round.
# ─────────────────────────────────────────────────────────────────────────────
role_definitions:
  - name: orchestrator
    label: Orchestrator
    description: Plans work and coordinates agents.
    provider: openai               # provider name this role routes to (single-binding fallback)
    model_override: gpt-4o         # specific model string (optional)
    # models:                      # ordered provider>model priority list (preferred; failover)
    #   - { provider: openai,    model: gpt-4o }
    #   - { provider: ollama-local, model: llama3.2 }   # fallback if openai is unavailable
    capabilities: [creates_tasks]
    allowed_tools: [list_tasks, create_work_package, plan_project, query_context, save_context, task_comment, run_subagent, checkpoint_session]
    context_include: []            # context types to inject (empty = all)
    context_exclude: []            # context types to omit
    # system_prompt is used verbatim at runtime (no template substitution); the
    # {{...}} syntax only resolves in the Roles-page "Preview" with vars you supply.
    system_prompt: |
      You are the orchestrator. Break requirements into work packages and
      coordinate the worker and reviewer agents.
    # resync_prompt: task description handed to this role on a project "Re-sync
    # scope". Empty → built-in default. Editable later on the Roles page.
    resync_prompt: |
      Read the project description, then reconcile the project scope against it:
      1. Use sync_scope (or bootstrap_project if the project has no requirements/features yet)
         to create or update the requirements and features that the description implies.
      2. Create work packages (create_work_package / plan_project) for the work needed to
         complete the project, assigning each an appropriate role so other agents can pick them up.
    temperature: 0.7
    max_tokens: 4096

  - name: reviewer
    label: Reviewer
    description: Reviews worker output and owns the merge gate (code review + merge-review).
    provider: anthropic
    model_override: claude-sonnet-4-6
    capabilities: [handles_review, handles_merge]
    allowed_tools: [read_file, list_files, task_comment, run_subagent, checkpoint_session]

  - name: worker
    label: Worker
    description: Implements tasks — code, tests, docs.
    provider: openai
    model_override: gpt-4o
    capabilities: []
    allowed_tools: [read_file, write_file, list_files, apply_diff, run_tests, task_comment, run_subagent, checkpoint_session]

# ─────────────────────────────────────────────────────────────────────────────
# Skills — persona specializations agents compose on top of their role(s).
# Seeded into the DB on first run (idempotent by name; Skills page wins after).
# Each adds a prompt fragment, context include/exclude globs, and optional tools.
# Omit this section to seed the built-in set (backend / frontend / infra).
# ─────────────────────────────────────────────────────────────────────────────
skills:
  - name: backend
    label: Backend
    description: Server-side, APIs, data, business logic.
    prompt_fragment: "You specialize in backend development: server-side logic, APIs, data modeling, and persistence. Favor correctness, clear error handling, and tests."
    context_include: ["server/**", "db/**", "api/**"]
    context_exclude: []
    allowed_tools: []              # extra tools added on top of the role's set
  - name: frontend
    label: Frontend
    description: UI, components, client-side state.
    prompt_fragment: "You specialize in frontend development: UI components, layout, accessibility, and client-side state. Keep components simple and match the existing design system."
    context_include: ["ui/**"]
  - name: infra
    label: Infrastructure
    description: Build, CI/CD, deployment, configuration.
    prompt_fragment: "You specialize in infrastructure: build pipelines, CI/CD, deployment, and configuration. Prefer reproducible, minimal, well-documented changes."
    context_include: ["deploy/**", "config/**", ".github/**"]

# ─────────────────────────────────────────────────────────────────────────────
# Subagent Skills — spawnable units of work an agent delegates to via the
# run_subagent tool. A subagent runs its own focused tool loop and returns only a
# summary, so its heavy context never enters the main agent's history.
# Seeded on first run (idempotent by name; Subagents page wins after).
#   {{instructions}} in prompt_template is replaced with the main agent's ask.
#   tool_allowlist must NOT include run_subagent — subagents cannot nest.
#   max_rounds bounds the subagent loop; max_tokens 0 = no extra cap.
# A present section OVERRIDES the built-in defaults, so it must list EVERY skill a
# worker/reviewer task requires or the mandatory-core-skill preflight fails the task.
# Required core set: prompt_prep, investigate_codebase, task_status, and the role's
# work skill (code_subtask for workers, review_subtask for reviewers).
# Omit this whole section to seed the built-in set (all five below).
# ─────────────────────────────────────────────────────────────────────────────
subagent_skills:
  - name: investigate_codebase
    label: Investigate Codebase
    description: Read-only exploration of a checked-out codebase; returns a findings summary.
    tool_allowlist: [read_file, list_files, search_files]
    max_rounds: 8
    max_tokens: 0
    context_include: []
    context_exclude: []
    prompt_template: |
      You are a focused investigation subagent operating on a checked-out codebase. You have read-only tools (read_file, list_files, search_files). Use search_files to locate files by name or by content (regex) before reading them. Investigate exactly what is asked, reading only the files you need. Do not attempt to modify anything.

      Investigation request:
      {{instructions}}

      When you have gathered enough, STOP calling tools and reply with a single concise findings summary: the key files, how they fit together, and direct answers to the request. This summary is the only thing returned to the main agent, so make it self-contained.
  - name: code_subtask
    label: Code Subtask
    description: Read/write coding subtask over the shared worktree; returns a summary of changes made.
    tool_allowlist: [read_file, write_file, apply_diff, list_files, run_tests, search_files]
    max_rounds: 12
    prompt_template: |
      You are a focused coding subagent operating on the main agent's checked-out worktree. You may read and modify files (read_file, write_file, apply_diff, list_files, search_files) and run tests (run_tests). Make only the changes the task describes; do not commit or push — the main agent owns version control.

      Coding task:
      {{instructions}}

      When done, STOP calling tools and reply with a concise summary of exactly what you changed (files touched and why) and the test outcome. This summary is the only thing returned to the main agent, so make it self-contained.
  - name: prompt_prep
    label: Prompt Prep
    description: Synthesizes the optimal system prompt for an upcoming LLM call from the layered inputs; returns the prompt only.
    tool_allowlist: []           # one-shot synthesis, no tools
    max_rounds: 1
    prompt_template: |
      You are a prompt-preparation subagent. Your only job is to synthesize the single best system prompt for the upcoming LLM call, given the layered inputs below. The layers are labeled and given in priority order (agent, role, subagent, provider, model) followed by the task description; on later rounds you also receive the prompt actually used last round and the model's latest result, so you can roll the prompt forward.

      Composition inputs:
      {{instructions}}

      Blend the layers into one coherent, self-contained system prompt that keeps the higher-priority layers' intent, folds in anything still relevant from the prior prompt, and adapts to the latest result. Reply with ONLY the synthesized system prompt text — no preamble, no explanation, no code fences.
  - name: review_subtask
    label: Review Subtask
    description: Read-only review of the changes on the task branch; returns a verdict and notes.
    tool_allowlist: [read_file, list_files, search_files]
    max_rounds: 10
    prompt_template: |
      You are a focused code-review subagent operating on the main agent's checked-out worktree. You have read-only tools (read_file, list_files, search_files). Review the changes for correctness, clarity, and adherence to the task; do not modify anything.

      Review request:
      {{instructions}}

      When done, STOP calling tools and reply with a concise review: an overall verdict (approved / changes_requested / revision_requested) followed by specific, actionable notes referencing files and lines. This review is the only thing returned to the main agent, so make it self-contained.
  - name: task_status
    label: Task Status
    description: Reconstructs a concise resume brief for a task from its durable record; returns the brief.
    tool_allowlist: [get_task_progress, read_memory, read_file, list_files]
    max_rounds: 8
    prompt_template: |
      You are a task-status reconstruction subagent. Reconstruct, concisely, where a task currently stands so a fresh work session can continue without redoing work. You have read-only tools: get_task_progress (ordered checkpoint summaries of prior sessions), read_memory (the task's durable memory), and read_file / list_files (the task branch contents).

      Reconstruction request:
      {{instructions}}

      Gather the checkpoint summaries and memory first, then inspect the branch only as needed. STOP calling tools once you can summarize, and reply with a single concise resume brief: what has been done, the current state, key decisions, and what remains. This brief is the only thing returned, so make it self-contained.

# ─────────────────────────────────────────────────────────────────────────────
# Agent Templates — server-managed, spawn N co-located agents per template.
# Seeded on first run; manage afterwards on the Agents page.
# ─────────────────────────────────────────────────────────────────────────────
agent_templates:
  - name: worker
    roles: [worker]
    skills: []                     # specialization tags (see context/skills)
    replicas: 2                    # desired running instances
    autostart: false              # relaunch desired replicas on server boot
  - name: reviewer
    roles: [reviewer]
    replicas: 1
    autostart: false
  - name: orchestrator
    roles: [orchestrator]
    replicas: 1
    autostart: true

# ─────────────────────────────────────────────────────────────────────────────
# Context Rules — which context types are injected per role.
# include: types to inject · exclude overrides include when both are set.
# ─────────────────────────────────────────────────────────────────────────────
context_rules:
  worker:
    include: [code, diff, test_results, problems]
    exclude: [docs, folder_structure]
  reviewer:
    include: [diff, code, test_results]
    exclude: [docs, folder_structure]

# ─────────────────────────────────────────────────────────────────────────────
# Token Pricing (USD per 1,000,000 tokens) — fallback for models without
# per-model pricing above. Keys must match the model string sent to the provider.
# ─────────────────────────────────────────────────────────────────────────────
pricing:
  gpt-4o:
    input_per_million: 2.50
    output_per_million: 10.00
  claude-sonnet-4-6:
    input_per_million: 3.00
    output_per_million: 15.00

# ─────────────────────────────────────────────────────────────────────────────
# Agents (defaults + instances + the server-managed supervisor)
# ─────────────────────────────────────────────────────────────────────────────
agents:
  heartbeat_interval_sec: 30       # agent → server heartbeat cadence. Default: 30
  task_poll_interval_sec: 5        # how often an agent polls for work. Default: 5
  task_timeout_sec: 300            # stale-task re-queue threshold. Default: 300
  max_retries: 3                   # LLM call retries before failing a task. Default: 3
  fallback_provider: "ollama-local" # provider to try when the primary errors (optional)
  circuit_breaker_threshold: 5     # consecutive failures before tripping. Default: 5
  max_managed_agents: 0            # cap on server-spawned agents (0 = unlimited)
  # Multi-session orchestration: fraction of the model's context window at which the
  # main loop auto-checkpoints (summarize → persist → compact → continue in a fresh
  # session). Range (0,1]; out-of-range/omitted → 0.80. Default: 0.80
  context_threshold_fraction: 0.80

  # Agent API auth + TLS trust.
  api_key: ""                      # bearer token agents must present on /api/agent/*; empty = open.
                                   #   The server injects this into co-located agents automatically;
                                   #   remote agents read it here (or from $AGENT_AUTH_TOKEN).
  server_ca: ""                    # PEM CA file the agent trusts for the server's HTTPS cert
                                   #   (remote agents; co-located get it via $AGENT_SERVER_CA).
  tls_insecure: false              # agent skips TLS verification (dev only). Env: $AGENT_TLS_INSECURE=true

  port_pool_start: 18000           # first port in the agent test-server pool. Default: 18000
  port_pool_size: 100              # number of ports in the pool. Default: 100
  merge_supervisor_interval_sec: 10 # AWAITING_MERGE poll cadence. Default: 10

  # Startup connection retry (exponential backoff from initial → max).
  connect_initial_delay_ms: 1000   # initial backoff after first failure. Default: 1000
  connect_max_delay_ms: 30000      # backoff ceiling. Default: 30000
  connect_max_retries: 10          # 0 = retry indefinitely. Default: 10

  # Instances launched by "agent-orchestrator agents --config config.yaml".
  server_url: "http://localhost:8080"
  workdir: "./data/agent-work"           # root for agent checkouts → {workdir}/{name}
  definitions:
    - name: worker-1
      roles: [worker]
      skills: []                   # optional specialization tags
      mode: colocated              # "colocated" | "remote". Default: colocated
      # workdir: /tmp/worker-1     # per-agent override (else {workdir}/{name})
      # config: ./worker.yaml      # per-agent LLM config override (else reuse this file)
    - name: reviewer-1
      roles: [reviewer]

# ─────────────────────────────────────────────────────────────────────────────
# Log retention — seeds platform_settings at startup (UI changes take precedence).
# ─────────────────────────────────────────────────────────────────────────────
log_retention:
  agent_default_days: 14
  task_default_days: 30
  system_default_days: 7
  cleanup_interval_minutes: 60
  overrides:                       # per-event-type overrides (win over the category default)
    agent_llm_call: 7
    agent_tool_error: 30
    agent_registered: 90
    task_created: 90
    task_completed: 90

# ─────────────────────────────────────────────────────────────────────────────
# Storage — server-managed git (one bare repo per project, one worktree per task).
# ─────────────────────────────────────────────────────────────────────────────
storage:
  root: ./data                          # base directory for all server-managed storage
  repos_dir: repos                      # → {root}/{repos_dir}/{project_id}.git
  worktrees_dir: worktrees              # → {root}/{worktrees_dir}/{task_id}
  worktree_retention_failed_hours: 168  # retain failed-task worktrees (hours). Default: 168

# ─────────────────────────────────────────────────────────────────────────────
# Merge — how approved pull requests land on main. Both default to true.
# ─────────────────────────────────────────────────────────────────────────────
merge:
  squash: true          # collapse the branch into a single commit on main. Default: true
  delete_branch: true   # delete the source branch after a successful merge. Default: true

# ─────────────────────────────────────────────────────────────────────────────
# Task Types — seeded into the DB on first run (Settings page wins afterwards).
# Each type drives the branch name an agent creates for its tasks, via a
# template. Placeholders: {slug} (from the task title), {shortid}, {id}, {type}.
# Exactly one type should be `default: true` (applied when a task has no type).
# Omit this section to seed the built-in set (normal/bug/hotfix/release).
# ─────────────────────────────────────────────────────────────────────────────
task_types:
  - key: normal
    label: Normal
    branch_template: "feature/{slug}"
    default: true
  - key: bug
    label: Bug
    branch_template: "bug/{slug}"
  - key: hotfix
    label: Hotfix
    branch_template: "hotfix/{slug}"
  - key: release
    label: Release
    branch_template: "release/{slug}"
