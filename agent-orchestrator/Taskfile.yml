# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Agent Orchestrator — go-task task runner
#
# Install go-task:  https://taskfile.dev/installation/
# Run a task:       task <name>
# List all tasks:   task
#
# Shell note: multiline | scripts require bash/sh.
# On Windows use Git Bash, WSL, or run tasks from a bash-capable terminal.
version: '3'

# ── Project-wide variables ────────────────────────────────────────────────────
vars:
  BINARY:     agent-orchestrator
  BIN_DIR:    bin
  UI_DIR:     ui
  CONFIG:     config.yaml
  SERVER_URL: http://localhost:8080
  # ── Agent variables ───────────────────────────────────────────────────────
  # Number of agents to start (all share the same ROLES value).
  # For mixed roles start two agent groups separately — see start:mixed below.
  AGENTS:     '1'
  ROLES:      worker
  # Local workspace root for agent code checkouts (remote/default mode).
  # Each agent gets its own sub-directory: {WORKDIR}/agent-{n}
  WORKDIR: .agent-work
  # Agents can be given a full config path for LLM-executor access.
  # Leave empty to run lightweight polling-only agents.
  AGENT_CONFIG: ''
  # Binary file extension — .exe on Windows, empty on Unix
  EXT: '{{if eq OS "windows"}}.exe{{end}}'

# ── Default: list available tasks ─────────────────────────────────────────────
tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  # ============================================================
  # BUILD
  # ============================================================

  build:
    desc: "Full build: compile UI → embed into Go binary"
    cmds:
      - task: build:ui
      - task: build:server

  build:ui:
    desc: Install UI deps and compile Svelte/Vite app (output → ui/dist/)
    dir: '{{.UI_DIR}}'
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build
    sources:
      - src/**/*.svelte
      - src/**/*.js
      - src/**/*.css
      - index.html
      - package.json
      - vite.config.js
      - vitest.config.js
      - svelte.config.js
      - postcss.config.js
    generates:
      - dist/index.html

  build:server:
    desc: Compile the Go binary (ui/dist is embedded; run build:ui first or use build)
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags="-s -w" -o {{.BIN_DIR}}/{{.BINARY}}{{.EXT}} .
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      - ui/dist/**
    generates:
      - '{{.BIN_DIR}}/{{.BINARY}}{{.EXT}}'

  # ============================================================
  # TEST
  # ============================================================

  test:
    desc: Run all tests — Go unit tests then Vitest UI tests
    cmds:
      - task: test:server
      - task: test:ui

  test:server:
    desc: Run Go tests with race detector
    cmds:
      - go test -v -race -count=1 ./...

  test:ui:
    desc: Run Vitest unit and component tests (no server required)
    dir: '{{.UI_DIR}}'
    cmds:
      - pnpm test

  test:ui:watch:
    desc: Run Vitest in interactive watch mode
    dir: '{{.UI_DIR}}'
    cmds:
      - pnpm test:watch

  test:ui:coverage:
    desc: Run Vitest with V8 coverage report (output → ui/coverage/)
    dir: '{{.UI_DIR}}'
    cmds:
      - pnpm test:coverage

  test:go:integration:
    desc: |
      Run Go integration tests (spin up a real server + git repos internally).
      No running server needed — each test manages its own resources.
      Add -run=<TestName> to target a single scenario.
    cmds:
      - go test -tags=integration -v -race -count=1 ./integration/...

  test:integration:
    desc: |
      Run full-stack integration tests against a live server.
      The server must already be running on {{.SERVER_URL}}.
      Override the URL: task test:integration SERVER_URL=http://localhost:9090
    dir: '{{.UI_DIR}}'
    env:
      INTEGRATION_URL: '{{.SERVER_URL}}'
    cmds:
      - pnpm test:integration

  test:e2e:
    desc: |
      Run Playwright end-to-end tests (headless) against a live server.
      The server must already be running on {{.SERVER_URL}}.
      Override: task test:e2e BASE_URL=http://localhost:9090
    dir: '{{.UI_DIR}}'
    env:
      BASE_URL: '{{.SERVER_URL}}'
    cmds:
      - pnpm e2e

  test:e2e:headed:
    desc: Run Playwright e2e tests in headed (visible browser) mode.
    dir: '{{.UI_DIR}}'
    env:
      BASE_URL: '{{.SERVER_URL}}'
    cmds:
      - pnpm e2e:headed

  # ============================================================
  # LINT
  # ============================================================

  lint:
    desc: Lint everything — Go vet/staticcheck + UI svelte-check
    cmds:
      - task: lint:server
      - task: lint:ui

  lint:server:
    desc: |
      Run go vet (always) and staticcheck (if installed).
      Install staticcheck: go install honnef.co/go/tools/cmd/staticcheck@latest
    cmds:
      - go vet ./...
      - cmd: staticcheck ./...
        ignore_error: true

  lint:ui:
    desc: |
      Validate UI code with svelte-check then verify build succeeds.
      Install svelte-check: cd ui && pnpm add -D svelte-check
    dir: '{{.UI_DIR}}'
    cmds:
      - cmd: pnpm exec svelte-check --output human 2>&1
        ignore_error: true
      - pnpm build

  # ============================================================
  # CI PIPELINE
  # ============================================================

  ci:
    desc: |
      Full CI pipeline: lint → server tests → UI build → UI tests → final binary.
      Suitable for CI/CD environments.
    cmds:
      - task: lint:server
      - task: test:server
      - task: build:ui
      - task: test:ui
      - task: build:server
      # test:e2e is intentionally last — it requires a live server.
      # Uncomment the line below when the server binary is available in CI:
      # - task: test:e2e

  # ============================================================
  # RUN / DEVELOPMENT
  # ============================================================

  run:server:
    desc: Build everything then start the server (Ctrl+C to stop)
    cmds:
      - task: build
      - ./{{.BIN_DIR}}/{{.BINARY}}{{.EXT}} server --config {{.CONFIG}}

  dev:
    desc: |
      Build server binary then start it together with the Vite dev server
      (hot-reload UI with proxy to localhost:8080). Ctrl+C stops both.
      Prerequisites: build:ui must have run at least once (or: task build dev)
    deps: [build:server]
    cmds:
      - task: _dev:run

  dev:ui:
    desc: Start only the Vite dev server (proxies /api and /ws → http://localhost:8080)
    dir: '{{.UI_DIR}}'
    cmds:
      - pnpm dev

  # ============================================================
  # AGENTS
  # ============================================================

  agents:
    desc: |
      Start N agent processes (foreground). Ctrl+C stops all agents.

      Variables:
        AGENTS=<n>            Number of agents to start     (default: 1)
        ROLES=<r1,r2>         Comma-separated roles         (default: worker)
        WORKDIR=<path>        Local workspace root          (default: .agent-work)
        SERVER_URL=<url>      Orchestrator URL              (default: http://localhost:8080)
        AGENT_CONFIG=<path>   Config YAML for full LLM mode (default: empty = polling only)

      Examples:
        task agents                                              # 1 worker
        task agents AGENTS=3                                     # 3 workers
        task agents AGENTS=2 ROLES=reviewer                      # 2 reviewers
        task agents AGENTS=2 WORKDIR=/data/agent-work            # custom workspace root
        task agents AGENTS=2 ROLES=worker AGENT_CONFIG=config.yaml
    cmds:
      - task: _procs:agents

  start:
    desc: |
      Build everything then start the full stack: server + N agents.
      Ctrl+C stops all. For persistent multi-agent setups use: docker compose up

      Variables:
        AGENTS=<n>            Number of agents to start (default: 1)
        ROLES=<roles>         Agent roles               (default: worker)
        WORKDIR=<path>        Local workspace root      (default: .agent-work)
        CONFIG=<path>         Server config             (default: config.yaml)
        AGENT_CONFIG=<path>   Agent config / LLM        (default: empty)
        SERVER_URL=<url>      Override server URL        (default: http://localhost:8080)

      Examples:
        task start                                      # 1 worker agent
        task start AGENTS=3                             # 3 worker agents
        task start AGENTS=2 ROLES=worker,reviewer       # 2 all-role agents
        task start AGENTS=2 WORKDIR=/data/agent-work    # custom workspace
        task start ROLES=worker AGENT_CONFIG=config.yaml
    cmds:
      - task: build
      - task: _start:run

  start:agents:
    desc: |
      Build everything then start agents defined in an agents YAML config file.
      Ctrl+C stops all.

      Variables:
        AGENTS_CONFIG=<path>   Path to agents config YAML (default: agents.yaml)
        SERVER_URL=<url>       Override server_url from config (default: "")

      Examples:
        task start:agents
        task start:agents AGENTS_CONFIG=my-agents.yaml
        task start:agents SERVER_URL=http://remote-host:8080
    vars:
      AGENTS_CONFIG: '{{.AGENTS_CONFIG | default "agents.yaml"}}'
    cmds:
      - task: build
      - ./{{.BIN_DIR}}/{{.BINARY}}{{.EXT}} agents --config {{.AGENTS_CONFIG}}{{if .SERVER_URL}} --server {{.SERVER_URL}}{{end}}

  start:mixed:
    desc: |
      Build everything then start server + separate worker and reviewer pools.
      Ctrl+C stops all.

      Variables:
        WORKERS=<n>           Number of worker agents   (default: 2)
        REVIEWERS=<n>         Number of reviewer agents (default: 1)
        WORKDIR=<path>        Local workspace root      (default: .agent-work)
        CONFIG=<path>         Server config             (default: config.yaml)
        AGENT_CONFIG=<path>   Agent config / LLM        (default: empty)
        SERVER_URL=<url>      Override server URL        (default: http://localhost:8080)

      Examples:
        task start:mixed                              # 2 workers + 1 reviewer
        task start:mixed WORKERS=4 REVIEWERS=2
        task start:mixed WORKDIR=/data/agent-work AGENT_CONFIG=config.yaml
    vars:
      WORKERS:   '{{.WORKERS   | default "2"}}'
      REVIEWERS: '{{.REVIEWERS | default "1"}}'
    cmds:
      - task: build
      - task: _start:run:mixed
        vars:
          WORKERS:   '{{.WORKERS}}'
          REVIEWERS: '{{.REVIEWERS}}'

  # ============================================================
  # INTERNAL PROCESS HELPERS  (used by dev / agents / start)
  # These use go-task's native concurrent deps — no shell trap needed,
  # works identically on Linux, macOS, and Windows.
  # ============================================================

  _dev:run:
    internal: true
    deps:
      - task: _proc:server
      - task: _proc:ui

  _start:run:
    internal: true
    deps:
      - task: _proc:server
      - task: _procs:agents

  _start:run:mixed:
    internal: true
    deps:
      - task: _proc:server
      - task: _procs:workers
        vars: {COUNT: '{{.WORKERS}}'}
      - task: _procs:reviewers
        vars: {COUNT: '{{.REVIEWERS}}'}

  _proc:server:
    internal: true
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}}{{.EXT}} server --config {{.CONFIG}}

  _proc:ui:
    internal: true
    dir: '{{.UI_DIR}}'
    cmds:
      - pnpm dev

  # Starts {{.AGENTS}} agents, all with role {{.ROLES}}.
  # Each agent gets its own workdir sub-directory: {{.WORKDIR}}/agent-{n}
  _procs:agents:
    internal: true
    cmds:
      - |
        pids=""
        for i in $(seq 1 {{.AGENTS}}); do
          ./{{.BIN_DIR}}/{{.BINARY}}{{.EXT}} agent \
            --name "agent-$i" \
            --roles "{{.ROLES}}" \
            --workdir "{{.WORKDIR}}/agent-$i" \
            --server "{{.SERVER_URL}}"{{if .AGENT_CONFIG}} --config "{{.AGENT_CONFIG}}"{{end}} &
          pids="$pids $!"
        done
        trap "kill $pids 2>/dev/null" INT TERM EXIT
        wait

  # Starts {{.COUNT}} worker agents.
  _procs:workers:
    internal: true
    cmds:
      - |
        pids=""
        for i in $(seq 1 {{.COUNT}}); do
          ./{{.BIN_DIR}}/{{.BINARY}}{{.EXT}} agent \
            --name "worker-$i" \
            --roles "worker" \
            --workdir "{{.WORKDIR}}/worker-$i" \
            --server "{{.SERVER_URL}}"{{if .AGENT_CONFIG}} --config "{{.AGENT_CONFIG}}"{{end}} &
          pids="$pids $!"
        done
        trap "kill $pids 2>/dev/null" INT TERM EXIT
        wait

  # Starts {{.COUNT}} reviewer agents.
  _procs:reviewers:
    internal: true
    cmds:
      - |
        pids=""
        for i in $(seq 1 {{.COUNT}}); do
          ./{{.BIN_DIR}}/{{.BINARY}}{{.EXT}} agent \
            --name "reviewer-$i" \
            --roles "reviewer" \
            --workdir "{{.WORKDIR}}/reviewer-$i" \
            --server "{{.SERVER_URL}}"{{if .AGENT_CONFIG}} --config "{{.AGENT_CONFIG}}"{{end}} &
          pids="$pids $!"
        done
        trap "kill $pids 2>/dev/null" INT TERM EXIT
        wait

  # ============================================================
  # CLEAN
  # ============================================================

  clean:
    desc: Remove compiled binary and UI dist
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf {{.UI_DIR}}/dist

  clean:all:
    desc: Remove all build artifacts including node_modules and the SQLite database
    deps: [clean]
    cmds:
      - rm -rf {{.UI_DIR}}/node_modules
      - rm -rf data
      - rm -f *.db
