# Agent Orchestrator - Example Configuration
# Copy this file, fill in your API keys, and run:
#   ./agent-orchestrator server --config config.yaml

providers:
  # Uncomment and fill in your OpenAI-compatible company API
  # - name: company-api
  #   type: openai_compatible
  #   base_url: https://api.company.com/v1
  #   api_key: ${COMPANY_API_KEY}

  # Local Ollama (no API key needed)
  - name: ollama-local
    type: ollama
    base_url: http://localhost:11434

  # Anthropic Claude
  # - name: claude
  #   type: anthropic
  #   api_key: ${ANTHROPIC_API_KEY}

models:
  # Orchestrator / reviewer model (fast, smart)
  # - name: o4-mini
  #   provider: company-api
  #   model: o4-mini
  #   roles: [orchestrator, reviewer, chat_brain]

  # Worker model (local coder)
  - name: qwen-coder
    provider: ollama-local
    model: qwen2.5-coder:7b
    roles: [worker]

roles:
  # orchestrator: o4-mini
  worker: qwen-coder
  # reviewer: o4-mini
  # chat_brain: o4-mini
  # embedder: qwen-coder

routing:
  plan: orchestrator
  implement: worker
  review: reviewer
  test: worker

prompts:
  implement: |
    You are a senior coding agent responsible for implementing work packages.

    Task: {task_description}
    Repo Path: {repo_path}
    Context: {context}

    Use tool calls to:
    1. Read relevant files
    2. Implement the feature
    3. Run tests
    4. Report results

  review: |
    You are a senior code reviewer.
    Review the implementation for correctness, testing, and alignment with requirements.

    Return JSON with:
    - approved: boolean
    - issues: array of issues
    - suggestions: array of improvement suggestions

context_rules:
  implement:
    include: [code, diff, test_results, problems]
    exclude: [docs, folder_structure]
  review:
    include: [diff, code, test_results]
    exclude: [docs, folder_structure]

server:
  port: 8080
  host: "0.0.0.0"
  tls_enabled: false

database:
  type: sqlite
  path: ./data/orchestrator.db

# Optional: store agent/task/system logs in a separate SQLite file.
# When omitted, logs default to ./data/logs.db (next to the main database).
# logs_db:
#   path: ./data/logs.db

agents:
  heartbeat_interval_sec: 30
  task_poll_interval_sec: 5
  task_timeout_sec: 300

  # Port pool for agent test/build servers.
  # Each colocated agent is assigned a unique port from this range when it
  # claims an execution-state task. Released when the agent exits the state.
  # port_pool_start: 18000   # first port in the pool (default 18000)
  # port_pool_size: 100      # number of ports available (default 100)

  # How often the merge supervisor polls for AWAITING_MERGE tasks (seconds).
  # merge_supervisor_interval_sec: 10

# Server-managed git storage (bare repos + agent worktrees).
# The storage root holds one bare repo per project and one worktree directory
# per colocated agent task. Defaults shown below.
# storage:
#   root: ./data                          # repos → {root}/repos/{id}.git, worktrees → {root}/worktrees/{task_id}
#   worktree_retention_failed_hours: 168  # retain failed-task worktrees for this many hours (default 168 = 7 days)
