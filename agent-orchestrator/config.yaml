# ═══════════════════════════════════════════════════════════════════════════════
# Agent Orchestrator — Default local configuration
#
# A ready-to-run setup: one local OpenAI-compatible provider whose single model
# serves all three roles, the role definitions themselves, and a few agent
# templates. Everything below is seeded into the database on first run only;
# afterwards the UI / API is the source of truth.
#
# Run:  ./agent-orchestrator server --config config.yaml
# See config.example.yaml for every available option, fully documented.
# ═══════════════════════════════════════════════════════════════════════════════

# ── LLM provider (local, OpenAI-compatible e.g. llama.cpp / LM Studio) ─────────
providers:
  - name: local
    type: openai_compatible
    base_url: http://localhost:7777/v1
    api_key: ""                          # local servers need no key
    models:
      - name: gemma-4-E4B-it-Q8_0.gguf
        default: true                    # this provider's default model
        roles: [orchestrator, reviewer, worker]
        input_per_million: 0.05
        output_per_million: 0.10
        text_tool_calls: true            # small models: emit tool calls as text

# ── Role definitions (capabilities drive review / merge routing) ──────────────
role_definitions:
  - name: orchestrator
    label: Orchestrator
    description: Plans work and coordinates agents; merges approved work.
    provider: local
    model_override: gemma-4-E4B-it-Q8_0.gguf
    capabilities: [creates_tasks, handles_merge]
    allowed_tools: [list_tasks, create_work_package, plan_project, query_context, save_context, task_comment]

  - name: reviewer
    label: Reviewer
    description: Reviews worker output; suggestions only, no file writes.
    provider: local
    model_override: gemma-4-E4B-it-Q8_0.gguf
    capabilities: [handles_review]
    allowed_tools: [read_file, list_files, task_comment]

  - name: worker
    label: Worker
    description: Implements tasks — code, tests, docs.
    provider: local
    model_override: gemma-4-E4B-it-Q8_0.gguf
    capabilities: []
    allowed_tools: [read_file, write_file, list_files, apply_diff, run_tests, task_comment]

# ── Server-managed agent templates (spawn N co-located agents per role) ───────
agent_templates:
  - name: orchestrator
    roles: [orchestrator]
    replicas: 1
    autostart: false
  - name: reviewer
    roles: [reviewer]
    replicas: 1
    autostart: false
  - name: worker
    roles: [worker]
    replicas: 2
    autostart: false

# ── Core ──────────────────────────────────────────────────────────────────────
server:
  port: 8080
  host: "0.0.0.0"

database:
  type: sqlite
  path: ./data/orchestrator.db

agents:
  heartbeat_interval_sec: 30
  task_poll_interval_sec: 5
  task_timeout_sec: 300
  server_url: "http://localhost:8080"
  workdir: ".agent-work"
